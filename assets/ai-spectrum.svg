<svg width="860" height="245" viewBox="0 0 860 245" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap');
      .quest-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; fill: #FFFFFF; }
      .quest-desc { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12.5px; fill: #A5B4BA; }
    </style>
  </defs>

  <!-- 3D Card Base (Shadow Rim) -->
  <rect x="2" y="8" width="856" height="233" rx="22" fill="#131F24" />
  <!-- 3D Card Front Body -->
  <rect x="2" y="2" width="856" height="233" rx="22" fill="#1B272C" stroke="#2E383D" stroke-width="2.5" />

  <!-- Quest Row 1: Deep Learning & Tensors -->
  <g transform="translate(32, 22)">
    <!-- 3D Icon Box (Purple) -->
    <rect x="0" y="4" width="46" height="46" rx="14" fill="#A560DB" />
    <rect x="0" y="0" width="46" height="46" rx="14" fill="#CE82FF" />
    <text x="23" y="28" font-size="20" text-anchor="middle" dominant-baseline="middle">🌐</text>

    <!-- Texts -->
    <text x="62" y="18" class="quest-title">Deep Learning &amp; Neural Architectures</text>
    <text x="62" y="38" class="quest-desc">Tensor computations, multi-layer representations, and deep learning foundations.</text>
  </g>

  <!-- Divider Line 1 -->
  <line x1="32" y1="84" x2="828" y2="84" stroke="#26343B" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Quest Row 2: LLMs & Multimodal AI -->
  <g transform="translate(32, 94)">
    <!-- 3D Icon Box (Yellow) -->
    <rect x="0" y="4" width="46" height="46" rx="14" fill="#E5A500" />
    <rect x="0" y="0" width="46" height="46" rx="14" fill="#FFC800" />
    <text x="23" y="28" font-size="20" text-anchor="middle" dominant-baseline="middle">✨</text>

    <!-- Texts -->
    <text x="62" y="18" class="quest-title">Large Language Models &amp; Multimodal AI</text>
    <text x="62" y="38" class="quest-desc">Google Gemini Multimodal Vision, prompt engineering, function calling &amp; agentic loops.</text>
  </g>

  <!-- Divider Line 2 -->
  <line x1="32" y1="156" x2="828" y2="156" stroke="#26343B" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Quest Row 3: Systems & Data Science -->
  <g transform="translate(32, 166)">
    <!-- 3D Icon Box (Blue) -->
    <rect x="0" y="4" width="46" height="46" rx="14" fill="#1899D6" />
    <rect x="0" y="0" width="46" height="46" rx="14" fill="#1CB0F6" />
    <text x="23" y="28" font-size="20" text-anchor="middle" dominant-baseline="middle">⚡</text>

    <!-- Texts -->
    <text x="62" y="18" class="quest-title">Applied Systems &amp; Data Science</text>
    <text x="62" y="38" class="quest-desc">Exploratory Data Analysis (EDA), vector math, and resilient fullstack system orchestration.</text>
  </g>

  <!-- Progress Bar (Duolingo Style XP Bar) -->
  <g transform="translate(32, 222)">
    <rect x="0" y="0" width="796" height="8" rx="4" fill="#2E383D" />
    <rect x="0" y="0" width="580" height="8" rx="4" fill="#58CC02" />
  </g>
</svg>
