<svg width="418" height="300" viewBox="0 0 418 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap');
      .card-title { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 900; font-size: 26px; fill: #FFFFFF; }
      .card-sub { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 800; font-size: 13.5px; fill: #38BDF8; letter-spacing: 0.5px; }
      .card-desc { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #94A3B8; }
      .pill-text { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 800; font-size: 11px; fill: #E2E8F0; text-anchor: middle; dominant-baseline: middle; }
      .btn-text { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 900; font-size: 14px; fill: #FFFFFF; letter-spacing: 0.5px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- 3D Card Base (Shadow Rim) -->
  <rect x="2" y="8" width="414" height="288" rx="22" fill="#121316" />
  <!-- 3D Card Front Body (Everdeck Dark Slate) -->
  <rect x="2" y="2" width="414" height="288" rx="22" fill="#18191E" stroke="#2D3139" stroke-width="2.5" />

  <!-- Clean Header Texts -->
  <text x="28" y="48" class="card-title">Anideck</text>
  <text x="28" y="70" class="card-sub">LOCAL ANIME &amp; MPV IPC COCKPIT</text>

  <!-- Description Text -->
  <text x="28" y="104" class="card-desc">Tactile desktop-web companion for local MKV anime playback.</text>
  <text x="28" y="124" class="card-desc">Real-time MPV Named Pipe IPC telemetry, exact MM:SS resume</text>
  <text x="28" y="144" class="card-desc">memory, Jikan MAL sync &amp; Steam-style video storage cleaner.</text>

  <!-- Tech Stack Pills (Chunky Everdeck Chips — 362px flush alignment) -->
  <g transform="translate(28, 168)">
    <!-- Chip 1 -->
    <rect x="0" y="3" width="78" height="28" rx="10" fill="#121316" />
    <rect x="0" y="0" width="78" height="28" rx="10" fill="#21232B" stroke="#2D3139" stroke-width="1.5" />
    <text x="39" y="14" class="pill-text">React 19</text>

    <!-- Chip 2 -->
    <rect x="86" y="3" width="102" height="28" rx="10" fill="#121316" />
    <rect x="86" y="0" width="102" height="28" rx="10" fill="#21232B" stroke="#2D3139" stroke-width="1.5" />
    <text x="137" y="14" class="pill-text">MPV IPC Pipe</text>

    <!-- Chip 3 -->
    <rect x="196" y="3" width="90" height="28" rx="10" fill="#121316" />
    <rect x="196" y="0" width="90" height="28" rx="10" fill="#21232B" stroke="#2D3139" stroke-width="1.5" />
    <text x="241" y="14" class="pill-text">Node Bridge</text>

    <!-- Chip 4 -->
    <rect x="294" y="3" width="68" height="28" rx="10" fill="#121316" />
    <rect x="294" y="0" width="68" height="28" rx="10" fill="#21232B" stroke="#2D3139" stroke-width="1.5" />
    <text x="328" y="14" class="pill-text">Jikan API</text>
  </g>

  <!-- Chunky 3D Pushable Button (Everdeck Sky Blue) -->
  <g transform="translate(28, 218)">
    <rect x="0" y="5" width="362" height="48" rx="16" fill="#0284C7" />
    <rect x="0" y="0" width="362" height="48" rx="16" fill="#0EA5E9" />
    <text x="181" y="25" class="btn-text">EXPLORE REPOSITORY &#10132;</text>
  </g>
</svg>
