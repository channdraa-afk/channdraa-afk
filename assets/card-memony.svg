<svg width="418" height="300" viewBox="0 0 418 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap');
      .card-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 26px; fill: #FFFFFF; }
      .card-sub { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13.5px; fill: #CE82FF; letter-spacing: 0.5px; }
      .card-desc { font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; fill: #A5B4BA; }
      .pill-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; fill: #E5E9EB; text-anchor: middle; dominant-baseline: middle; }
      .btn-text { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; fill: #FFFFFF; letter-spacing: 0.5px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- 3D Card Base (Shadow Rim) -->
  <rect x="2" y="8" width="414" height="288" rx="22" fill="#131F24" />
  <!-- 3D Card Front Body -->
  <rect x="2" y="2" width="414" height="288" rx="22" fill="#1B272C" stroke="#2E383D" stroke-width="2.5" />

  <!-- Clean Header Texts (Left-Aligned) -->
  <text x="28" y="48" class="card-title">Memony</text>
  <text x="28" y="70" class="card-sub">AI TACTILE EXPENSE LEDGER</text>

  <!-- Description Text -->
  <text x="28" y="104" class="card-desc">Personal financial companion combining tactile</text>
  <text x="28" y="124" class="card-desc">interactions with Google Gemini Multimodal OCR,</text>
  <text x="28" y="144" class="card-desc">smart receipt memory, and installable PWA ledger.</text>

  <!-- Tech Stack Pills (Chunky Duolingo Chips) -->
  <g transform="translate(28, 168)">
    <!-- Chip 1 -->
    <rect x="0" y="3" width="108" height="28" rx="10" fill="#1F282D" />
    <rect x="0" y="0" width="108" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="54" y="14" class="pill-text">Gemini Vision</text>

    <!-- Chip 2 -->
    <rect x="116" y="3" width="76" height="28" rx="10" fill="#1F282D" />
    <rect x="116" y="0" width="76" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="154" y="14" class="pill-text">Firebase</text>

    <!-- Chip 3 -->
    <rect x="200" y="3" width="60" height="28" rx="10" fill="#1F282D" />
    <rect x="200" y="0" width="60" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="230" y="14" class="pill-text">PWA</text>

    <!-- Chip 4 -->
    <rect x="268" y="3" width="94" height="28" rx="10" fill="#1F282D" />
    <rect x="268" y="0" width="94" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="315" y="14" class="pill-text">Web Audio</text>
  </g>

  <!-- Chunky 3D Pushable Button (CTA) -->
  <g transform="translate(28, 218)">
    <rect x="0" y="5" width="362" height="48" rx="16" fill="#A560DB" />
    <rect x="0" y="0" width="362" height="48" rx="16" fill="#CE82FF" />
    <text x="181" y="25" class="btn-text">EXPLORE REPOSITORY ➔</text>
  </g>
</svg>
