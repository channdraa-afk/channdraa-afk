<svg width="418" height="310" viewBox="0 0 418 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap');
      .card-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px; fill: #FFFFFF; }
      .card-sub { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; fill: #58CC02; }
      .card-desc { font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; fill: #A5B4BA; }
      .pill-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; fill: #E5E9EB; text-anchor: middle; dominant-baseline: middle; }
      .btn-text { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; fill: #FFFFFF; letter-spacing: 0.5px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- 3D Card Base (Shadow Rim) -->
  <rect x="2" y="8" width="414" height="298" rx="22" fill="#131F24" />
  <!-- 3D Card Front Body -->
  <rect x="2" y="2" width="414" height="298" rx="22" fill="#1B272C" stroke="#2E383D" stroke-width="2.5" />

  <!-- Header Icon & Name -->
  <g transform="translate(24, 24)">
    <!-- 3D Circle Icon (Green) -->
    <rect x="0" y="4" width="48" height="48" rx="16" fill="#46A302" />
    <rect x="0" y="0" width="48" height="48" rx="16" fill="#58CC02" />
    <text x="24" y="28" font-size="22" text-anchor="middle" dominant-baseline="middle">⚡</text>
    
    <text x="62" y="24" class="card-title">Stallmate</text>
    <text x="62" y="44" class="card-sub">Tactile Pop-up Cashier Engine</text>
  </g>

  <!-- Description Text -->
  <text x="24" y="104" class="card-desc">Realtime cashier engine for culinary stalls &amp; bazaars.</text>
  <text x="24" y="124" class="card-desc">Equipped with live kitchen display (KDS), automated</text>
  <text x="24" y="144" class="card-desc">WhatsApp queue notifications &amp; tactile synthesized audio.</text>

  <!-- Tech Stack Pills (Chunky Duolingo Chips) -->
  <g transform="translate(24, 172)">
    <!-- Chip 1 -->
    <rect x="0" y="3" width="80" height="28" rx="10" fill="#1F282D" />
    <rect x="0" y="0" width="80" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="40" y="14" class="pill-text">React 19</text>

    <!-- Chip 2 -->
    <rect x="88" y="3" width="90" height="28" rx="10" fill="#1F282D" />
    <rect x="88" y="0" width="90" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="133" y="14" class="pill-text">Supabase</text>

    <!-- Chip 3 -->
    <rect x="186" y="3" width="76" height="28" rx="10" fill="#1F282D" />
    <rect x="186" y="0" width="76" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="224" y="14" class="pill-text">Tailwind</text>

    <!-- Chip 4 -->
    <rect x="270" y="3" width="98" height="28" rx="10" fill="#1F282D" />
    <rect x="270" y="0" width="98" height="28" rx="10" fill="#2B383F" stroke="#3B4951" stroke-width="1.5" />
    <text x="319" y="14" class="pill-text">WhatsApp Bot</text>
  </g>

  <!-- Chunky 3D Pushable Button (CTA) -->
  <g transform="translate(24, 226)">
    <rect x="0" y="5" width="370" height="48" rx="16" fill="#46A302" />
    <rect x="0" y="0" width="370" height="48" rx="16" fill="#58CC02" />
    <text x="185" y="25" class="btn-text">EXPLORE REPOSITORY ➔</text>
  </g>
</svg>
