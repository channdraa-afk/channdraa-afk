<svg width="418" height="300" viewBox="0 0 418 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap');
      .card-title { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 900; font-size: 26px; fill: #0F172A; }
      .card-sub { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 800; font-size: 13px; fill: #059669; letter-spacing: 0.5px; }
      .card-desc { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #475569; }
      .pill-text { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 800; font-size: 11px; fill: #1E293B; text-anchor: middle; dominant-baseline: middle; }
      .btn-text { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 900; font-size: 14px; fill: #FFFFFF; letter-spacing: 0.5px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- 3D Card Base (Shadow Rim) -->
  <rect x="2" y="8" width="414" height="288" rx="22" fill="#CBD5E1" />
  <!-- 3D Card Front Body (Clean White) -->
  <rect x="2" y="2" width="414" height="288" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" />

  <!-- Clean Header Texts -->
  <text x="28" y="48" class="card-title">Loseless</text>
  <text x="28" y="70" class="card-sub">AGENT COGNITIVE DISCIPLINE &amp; PROTOCOL</text>

  <!-- Description Text -->
  <text x="28" y="104" class="card-desc">Strict execution gatekeeper &amp; cognitive protocol for coding agents.</text>
  <text x="28" y="124" class="card-desc">Zero context drift, Arise two-phase verification, mandatory Devil's</text>
  <text x="28" y="144" class="card-desc">Advocate reality checks &amp; root-cause convergence engine.</text>

  <!-- Tech Stack Pills (Chunky Light Chips — 362px flush alignment) -->
  <g transform="translate(28, 168)">
    <!-- Chip 1 -->
    <rect x="0" y="3" width="86" height="28" rx="10" fill="#E2E8F0" />
    <rect x="0" y="0" width="86" height="28" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="43" y="14" class="pill-text">Antigravity</text>

    <!-- Chip 2 -->
    <rect x="94" y="3" width="86" height="28" rx="10" fill="#E2E8F0" />
    <rect x="94" y="0" width="86" height="28" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="137" y="14" class="pill-text">Gemini CLI</text>

    <!-- Chip 3 -->
    <rect x="188" y="3" width="98" height="28" rx="10" fill="#E2E8F0" />
    <rect x="188" y="0" width="98" height="28" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="237" y="14" class="pill-text">Arise Protocol</text>

    <!-- Chip 4 -->
    <rect x="294" y="3" width="68" height="28" rx="10" fill="#E2E8F0" />
    <rect x="294" y="0" width="68" height="28" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="328" y="14" class="pill-text">MIT Core</text>
  </g>

  <!-- Chunky 3D Pushable Button (Emerald Glow) -->
  <g transform="translate(28, 218)">
    <rect x="0" y="5" width="362" height="48" rx="16" fill="#059669" />
    <rect x="0" y="0" width="362" height="48" rx="16" fill="#10B981" />
    <text x="181" y="25" class="btn-text">EXPLORE REPOSITORY &#10132;</text>
  </g>
</svg>
